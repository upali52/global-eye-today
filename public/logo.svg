<svg viewBox="0 0 320 72" xmlns="http://www.w3.org/2000/svg" width="320" height="72">
  <!-- Eye outline -->
  <path d="M6 36 C20 12 52 12 66 36 C52 60 20 60 6 36Z" fill="none" stroke="#111827" stroke-width="3"/>
  <!-- Globe circle (iris) -->
  <circle cx="36" cy="36" r="17" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
  <!-- Longitude ellipse -->
  <ellipse cx="36" cy="36" rx="8.5" ry="17" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <!-- Latitude lines -->
  <line x1="19" y1="36" x2="53" y2="36" stroke="#dc2626" stroke-width="1.5"/>
  <path d="M22 27 Q36 23 50 27" fill="none" stroke="#dc2626" stroke-width="1.2"/>
  <path d="M22 45 Q36 49 50 45" fill="none" stroke="#dc2626" stroke-width="1.2"/>
  <!-- Pupil -->
  <circle cx="36" cy="36" r="5.5" fill="#111827"/>
  <!-- Eye highlight -->
  <circle cx="33" cy="33" r="1.8" fill="white" opacity="0.7"/>

  <!-- Wordmark -->
  <text x="80" y="30" font-family="Arial Black, Arial, sans-serif" font-size="20" font-weight="900" fill="#111827" letter-spacing="1">GLOBAL EYE</text>
  <!-- Red accent line -->
  <rect x="80" y="36" width="202" height="2.5" fill="#dc2626"/>
  <!-- TODAY tagline -->
  <text x="80" y="58" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#dc2626" letter-spacing="8">TODAY</text>
</svg>
